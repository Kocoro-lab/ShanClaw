name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on the same ref when new commits land, so rapid
# pushes to a PR don't stack parallel test runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-links:
    # CLAUDE.md and AGENTS.md cite files by path, and those paths rot quietly:
    # a doc gets renamed or was never committed, the pointer stays, and the
    # next reader follows it into nothing. An audit on 2026-08-13 found 20
    # such references across the four repos, some of them cited as the
    # authoritative spec for a wire protocol.
    #
    # A missing target is allowed when the citing line says so -- a few design
    # docs are deliberately untracked and live only on a maintainer's machine.
    # Marking such a reference is what keeps it honest; an unmarked one is a
    # bug. Pure text work, so ubuntu and no toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test the checker
        # Its failure mode is silence — a broken pattern looks exactly like tidy
        # guides — so the checker runs against fixtures before it judges the repo.
        run: bash scripts/check-doc-links-test.sh

      - name: Check doc references resolve
        run: bash scripts/check-doc-links.sh

      - name: AGENTS.md stays under the harness injection budget
        # Harnesses that read AGENTS.md do so under a byte budget shared across
        # every such file from the repo root down (32 KiB by default), and an
        # over-budget file is truncated from the TAIL with no marker in the
        # injected text. The reader cannot tell it got a partial file, so this
        # has to be caught here rather than noticed later. 24 KB leaves room for
        # the per-directory files a harness may also pull in.
        run: |
          size=$(wc -c < AGENTS.md)
          if [ "$size" -gt 24576 ]; then
            echo "AGENTS.md is ${size}B, over the 24576B ceiling."
            echo "Harnesses truncate from the tail silently — cut prose, not rules."
            exit 1
          fi
          echo "AGENTS.md ${size}B, $((24576 - size))B headroom"

      - name: AGENTS.md does not grow near the ceiling
        # The byte-budget rule AGENTS.md states about itself: within 1 KiB of
        # the 24576B ceiling, adding bytes requires cutting at least as many
        # from the file in the same PR. Scoped to that pressure zone so
        # headroom recovered by a consolidation pass stays usable. checkout@v5
        # is depth 1, so the base blob is fetched explicitly.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
          base=$(git show ${{ github.event.pull_request.base.sha }}:AGENTS.md | wc -c)
          head=$(wc -c < AGENTS.md)
          if [ "$head" -gt 23552 ] && [ "$head" -gt "$base" ]; then
            echo "AGENTS.md grew ${base}B -> ${head}B within 1 KiB of the 24576B ceiling."
            echo "Adding bytes here requires cutting at least as many from AGENTS.md."
            exit 1
          fi
          echo "AGENTS.md ${base}B -> ${head}B, ok"

  test:
    # macos-latest matches the project's release.yml and the development
    # target. ShanClaw ships a meaningful set of macOS-only tools
    # (accessibility, ghostty, screenshot, applescript) whose tests
    # invoke platform binaries directly; ubuntu runners lack those
    # binaries and can't run the full suite.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Pin to the exact version in go.mod so CI tracks the project's
          # Go version automatically on every bump. Mirrors release.yml.
          go-version-file: go.mod
          cache: true

      - name: Install libopus (cgo dep for the koe voice package)
        # internal/koe imports gopkg.in/hraban/opus.v2, which is cgo and
        # links system libopus via `#cgo pkg-config: opus opusfile`. The
        # macos-latest runner does not ship opus.pc, so go vet/build/test
        # ./... (which all compile internal/koe) fail without this. malgo
        # bundles miniaudio and needs no system lib. Exporting PKG_CONFIG_PATH
        # to GITHUB_ENV makes it visible to every later step. brew --prefix
        # keeps the path correct on both arm64 and intel runners.
        run: |
          brew install opus opusfile pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Verify modules
        run: go mod verify

      - name: Check go.mod/go.sum are tidy
        # Fails loudly when a PR adds an import without running
        # `go mod tidy`, instead of letting it pass silently and break
        # downstream consumers of the module.
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Cross-compile check (windows, linux)
        # The daemon must keep cross-compiling for the Electron desktop app's
        # release CI, which builds it for windows/amd64 and linux/amd64. This
        # job runs on macOS, so without this guard a PR that reaches for a
        # POSIX-only syscall (syscall.Flock/Kill/Setpgid, os.Symlink, a
        # unix-only import) would pass green and silently break the Windows
        # binary. CGO is off, so no cross toolchain is needed. This also vets
        # the windows-tagged files (_windows.go) the macOS test job never
        # compiles.
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./...

      - name: Test
        # -count=1 disables the test result cache so CI actually runs
        # tests rather than replaying cached success from a prior run.
        # -timeout is per-package; the job-level timeout-minutes above
        # is the real overall ceiling.
        #
        # -skip '^TestGhosttyTool_ListTabs_Empty$' excludes one test
        # that requires Ghostty >= 1.3.0 to be installed on the runner.
        # GitHub's macos-latest images don't include Ghostty, and the
        # test isn't a meaningful smoke signal for the marketplace /
        # daemon work that actually needs CI coverage. Runs locally.
        # Remove this skip if Ghostty is ever added to the runner setup.
        run: go test -count=1 -timeout=5m -skip '^TestGhosttyTool_ListTabs_Empty$' ./...

      - name: Nested mobile module (iOS voice-brain binding)
        # mobile/ is a separate module on purpose (see its own go.mod), so every
        # step above — vet, build, the cross-compile matrix, test — skips it
        # entirely. koebind was therefore outside CI for its whole lifetime,
        # while being the source of the iOS Koe.xcframework: a break here ships
        # as "the iOS voice call cannot be rebuilt at all".
        #
        # The gobind step runs the binding GENERATOR, not just the compiler, so a
        # codegen-fatal change to the bound API is caught here rather than on
        # the one machine that later tries to produce the framework. It uses
        # `go tool gobind`, which resolves to the x/mobile revision this module
        # pins, so CI and a developer's local bind agree by construction.
        #
        # Scope, measured rather than assumed (x/mobile v0.0.0-20260813,
        # 2026-08-27): an exported func returning a map — unbindable per
        # gobind's own rules — is silently SKIPPED by both `gobind` and
        # `gomobile bind`, both exiting 0. So this is a smoke check on the
        # generator, NOT a guarantee that every unbindable shape is rejected.
        # Reviewing the bound surface against the rules in bind.go's header is
        # still a human job.
        #
        # The full `gomobile bind` is deliberately not run: it needs Xcode and
        # minutes, and the Desktop repo gates the artifact itself in an iOS
        # build phase (scripts/verify-koe-framework.sh).
        #
        # The module checks above ("Verify modules", "Check go.mod/go.sum are
        # tidy") have no working-directory, so they only ever saw the root
        # module: mobile/go.mod could drift indefinitely without failing CI.
        # They are repeated here rather than generalised, because the root steps
        # run before Go is even pointed at this directory.
        working-directory: mobile
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum
          go build ./...
          go vet ./...
          go test -count=1 -timeout=5m ./...
          go tool gobind -lang=objc -outdir="$(mktemp -d)" ./koebind
